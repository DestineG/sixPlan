name: sixplan

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sixplan:local
    restart: unless-stopped
    ports:
      - "${SIXPLAN_HTTP_BIND:-0.0.0.0}:${SIXPLAN_HTTP_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      SIXPLAN_HOST: 0.0.0.0
      SIXPLAN_PORT: 4173
      SIXPLAN_DATA_DIR: /data
      SIXPLAN_COOKIE_SECURE: auto
      SIXPLAN_ALLOW_OPEN_DATA_DIR: "false"
      SIXPLAN_IMPORT_MAX_FILE_BYTES: "${SIXPLAN_IMPORT_MAX_FILE_BYTES:-536870912}"
      SIXPLAN_IMPORT_MAX_NODES: "${SIXPLAN_IMPORT_MAX_NODES:-50000}"
      SIXPLAN_IMPORT_MAX_EDGES: "${SIXPLAN_IMPORT_MAX_EDGES:-250000}"
      SIXPLAN_IMPORT_MAX_MARKDOWN_BYTES: "${SIXPLAN_IMPORT_MAX_MARKDOWN_BYTES:-5242880}"
      SIXPLAN_IMPORT_MAX_TEMP_BYTES: "${SIXPLAN_IMPORT_MAX_TEMP_BYTES:-2147483648}"
      SIXPLAN_IMPORT_MAX_CONCURRENT_USER: "${SIXPLAN_IMPORT_MAX_CONCURRENT_USER:-2}"
      SIXPLAN_IMPORT_MAX_CONCURRENT_GLOBAL: "${SIXPLAN_IMPORT_MAX_CONCURRENT_GLOBAL:-8}"
      SIXPLAN_IMPORT_TASK_TIMEOUT_MS: "${SIXPLAN_IMPORT_TASK_TIMEOUT_MS:-1800000}"
      SIXPLAN_IMPORT_SESSION_HOURS: "${SIXPLAN_IMPORT_SESSION_HOURS:-24}"
    volumes:
      - sixplan-data:/data
    networks:
      sixplan:
        ipv4_address: 172.30.67.2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sixplan-data:
    name: "${SIXPLAN_DATA_VOLUME:-sixplan-data}"

networks:
  sixplan:
    name: sixplan-network
    ipam:
      config:
        - subnet: 172.30.67.0/24
