name: sixplan

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sixplan:local
    restart: unless-stopped
    ports:
      - "${SIXPLAN_HTTP_BIND:-0.0.0.0}:${SIXPLAN_HTTP_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      SIXPLAN_HOST: 0.0.0.0
      SIXPLAN_PORT: 4173
      SIXPLAN_DATA_DIR: /data
      SIXPLAN_COOKIE_SECURE: auto
      SIXPLAN_ALLOW_OPEN_DATA_DIR: "false"
    volumes:
      - sixplan-data:/data
    networks:
      sixplan:
        ipv4_address: 172.30.67.2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sixplan-data:
    name: sixplan-data

networks:
  sixplan:
    name: sixplan-network
    ipam:
      config:
        - subnet: 172.30.67.0/24
