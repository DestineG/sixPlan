services:
  app:
    environment:
      SIXPLAN_TRUST_PROXY: 172.30.67.3

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SIXPLAN_PUBLIC_IP: "${SIXPLAN_PUBLIC_IP:?请设置云服务器公网 IPv4}"
      ACME_EMAIL: "${ACME_EMAIL:?请设置证书通知邮箱}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      sixplan:
        ipv4_address: 172.30.67.3
    depends_on:
      app:
        condition: service_healthy

  frpc:
    image: snowdreamtech/frpc:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/frp/entrypoint.sh"]
    environment:
      FRP_SERVER_ADDR: "${FRP_SERVER_ADDR:?请设置云服务器地址}"
      FRP_SERVER_PORT: "${FRP_SERVER_PORT:-7000}"
      FRP_AUTH_TOKEN: "${FRP_AUTH_TOKEN:?请设置 FRP 认证令牌}"
    volumes:
      - ./deploy/frpc-entrypoint.sh:/etc/frp/entrypoint.sh:ro
    networks:
      sixplan:
        ipv4_address: 172.30.67.4
    depends_on:
      - gateway

volumes:
  caddy-data:
    name: sixplan-caddy-data
  caddy-config:
    name: sixplan-caddy-config
